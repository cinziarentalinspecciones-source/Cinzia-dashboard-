<script>
/* ===== PARCHE: calendario real en Reservas + móvil nuevo con mantenimientos ===== */
(function(){
  var MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var COL={CBA:"#3b82f6",BSAS:"#22c55e",BRC:"#a855f7",SALTA:"#f59e0b",MZA:"#14b8a6"};
  var SEDN={CBA:"Córdoba",BSAS:"Buenos Aires",BRC:"Bariloche",SALTA:"Salta",MZA:"Mendoza"};
  var ST={y:new Date().getFullYear(),m:new Date().getMonth(),sede:"todas",sel:null};
  var OK={a:false,b:false};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function pad(n){return n<10?"0"+n:""+n;}
  function fD(v){if(!v)return null;var d=v instanceof Date?v:new Date(v);return isNaN(d.getTime())?null:d;}
  function ddmm(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1);}
  function datos(){
    var src=(typeof RAW_DATA!=="undefined"&&RAW_DATA&&RAW_DATA.calendarioPanel)||[];
    return src.map(function(r){return {mov:Number(r.movil)||0,num:String(r.numeroReserva||""),fi:fD(r.fechaInicio),ff:fD(r.fechaFin),sede:String(r.sede||"").toUpperCase().trim(),tipo:r.estado||"Reserva",cli:r.cliente||"",edit:!!r.movilEditado};})
      .filter(function(e){return e.fi&&e.ff;});
  }
  function patente(m){try{var mp=getMovilAPatenteActivo();return mp[m]||"";}catch(e){return "";}}
  function flota(){try{return Object.keys(getMovilAPatenteActivo()).map(Number);}catch(e){return [];}}

  var st=document.createElement("style");
  st.textContent=".rc{padding:14px 18px 30px;color:var(--text);font-family:inherit}.rc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.rc-bar button,.rc-bar select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}.rc-mes{font-size:15px;font-weight:800;min-width:150px;text-align:center}.rc-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.rc-chip{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:11px;color:var(--muted)}.rc-chip b{display:block;font-size:19px;color:var(--text)}.rc-sync{font-size:11px;padding:6px 12px;border-radius:7px;margin-bottom:10px;display:inline-block}.rc-sync.ok{background:rgba(47,182,124,.14);color:#2FB67C}.rc-sync.warn{background:rgba(217,162,59,.14);color:#D9A23B}.rc-sync.bad{background:rgba(226,88,90,.14);color:#E2585A}.rc-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}.rc-t{min-width:900px}.rc-h,.rc-r{display:grid;grid-template-columns:92px 1fr}.rc-h{border-bottom:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:700}.rc-d{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;text-align:center}.rc-d span{padding:6px 0;border-left:1px solid var(--border)}.rc-d .we{color:#5b6070}.rc-d .hoy{color:#fff;background:var(--accent);font-weight:800}.rc-r{border-top:1px solid var(--border);min-height:36px}.rc-r:first-of-type{border-top:none}.rc-mv{padding:7px 10px;font-size:12px;font-weight:800;display:flex;flex-direction:column;justify-content:center;line-height:1.2}.rc-mv small{font-size:9.5px;color:var(--muted);font-weight:500}.rc-l{position:relative;height:36px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--n) - 1px),rgba(255,255,255,.05) calc(100%/var(--n) - 1px),rgba(255,255,255,.05) calc(100%/var(--n)))}.rc-b{position:absolute;top:5px;bottom:5px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:pointer;min-width:4px;box-shadow:0 1px 3px rgba(0,0,0,.35)}.rc-b:hover{filter:brightness(1.2)}.rc-b.ofe{background:transparent!important;border:1px dashed currentColor;color:var(--text)}.rc-b.srv{background:repeating-linear-gradient(45deg,#4b5563,#4b5563 6px,#374151 6px,#374151 12px)!important}.rc-b.sel{outline:2px solid #fff;z-index:3}.rc-hoyl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.8;pointer-events:none;z-index:2}.rc-leg{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px;font-size:11px;color:var(--muted)}.rc-leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.rc-det{margin-top:10px;padding:12px 16px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;font-size:12.5px;line-height:1.7}.rc-vacio{padding:34px;text-align:center;color:var(--muted)}";
  document.head.appendChild(st);

  function pintar(id){
    var el=document.getElementById(id); if(!el)return;
    var all=datos(), y=ST.y, m=ST.m, n=new Date(y,m+1,0).getDate(), ini=new Date(y,m,1), fin=new Date(y,m,n,23,59,59);
    var hoy=new Date(); hoy.setHours(0,0,0,0);
    var sedes={}; all.forEach(function(e){if(e.sede)sedes[e.sede]=1;});
    var lista=all.filter(function(e){return e.fi<=fin&&e.ff>=ini&&(ST.sede==="todas"||e.sede===ST.sede);});
    var cR=lista.filter(function(e){return e.tipo==="Reserva";}).length, cO=lista.filter(function(e){return e.tipo==="Oferta";}).length, cS=lista.filter(function(e){return e.tipo==="Servicio";}).length;
    var movs={}; lista.forEach(function(e){movs[e.mov]=1;});
    if(ST.sede==="todas") flota().forEach(function(x){movs[x]=1;});
    var rows=Object.keys(movs).map(Number).sort(function(a,b){return a-b;});
    var est=(typeof RAW_DATA!=="undefined"&&RAW_DATA&&RAW_DATA.calendarioEstado)||null, sync="";
    if(est&&est.ultimaCorrida){var mins=Math.round((Date.now()-new Date(est.ultimaCorrida).getTime())/60000);
      var cls=(!est.exito)?"bad":(mins>120?"warn":"ok");
      sync='<span class="rc-sync '+cls+'">'+(!est.exito?"La última sincronización falló: "+esc(est.mensaje):"Calendario sincronizado hace "+(mins<60?mins+" min":Math.round(mins/60)+" h"))+" · "+est.reservasEncontradas+" reservas en total</span>";}
    var dias=""; for(var i=1;i<=n;i++){var d=new Date(y,m,i),we=(d.getDay()===0||d.getDay()===6)?"we":"",hh=(d.getTime()===hoy.getTime())?" hoy":"";dias+='<span class="'+we+hh+'">'+i+'</span>';}
    var hoyPct=(hoy.getFullYear()===y&&hoy.getMonth()===m)?((hoy.getDate()-0.5)/n*100):null;
    var filas=rows.map(function(mv){
      var bars=lista.filter(function(e){return e.mov===mv;}).map(function(e){
        var sd=(e.fi.getFullYear()===y&&e.fi.getMonth()===m)?e.fi.getDate():1, ed=(e.ff.getFullYear()===y&&e.ff.getMonth()===m)?e.ff.getDate():n;
        var c=COL[e.sede]||"#6366f1", cls=e.tipo==="Servicio"?"srv":e.tipo==="Oferta"?"ofe":"", w=ed-sd+1;
        var lbl=w>=2?(e.tipo==="Servicio"?"Servicio":(e.tipo==="Oferta"?"Oferta ":"")+"#"+e.num):"";
        var sel=(ST.sel&&ST.sel.num===e.num&&ST.sel.tipo===e.tipo)?" sel":"";
        return '<div class="rc-b '+cls+sel+'" style="left:'+((sd-1)/n*100)+'%;width:'+(w/n*100)+'%;background:'+c+';color:'+(cls==="ofe"?c:"#fff")+'" title="'+esc(e.tipo+" "+e.num+" · M"+e.mov+" · "+ddmm(e.fi)+" al "+ddmm(e.ff)+" · "+(SEDN[e.sede]||e.sede))+'" onclick="RC.det(\''+id+'\','+mv+',\''+esc(e.num)+'\',\''+e.tipo+'\')">'+esc(lbl)+'</div>';
      }).join("");
      var pt=patente(mv);
      return '<div class="rc-r"><div class="rc-mv">M'+mv+(pt?'<small>'+esc(pt)+'</small>':'')+'</div><div class="rc-l" style="--n:'+n+'">'+bars+(hoyPct!=null?'<div class="rc-hoyl" style="left:'+hoyPct+'%"></div>':'')+'</div></div>';
    }).join("");
    var sedeOpts='<option value="todas">Todas las sedes</option>'+Object.keys(sedes).sort().map(function(s){return '<option value="'+s+'"'+(ST.sede===s?" selected":"")+'>'+esc(SEDN[s]||s)+'</option>';}).join("");
    var leg=Object.keys(sedes).sort().map(function(s){return '<span><i style="background:'+(COL[s]||"#6366f1")+'"></i>'+esc(SEDN[s]||s)+'</span>';}).join("");
    el.innerHTML='<div class="rc"><div class="rc-bar"><button onclick="RC.nav(-1)">◀</button><span class="rc-mes">'+MESES[m]+' '+y+'</span><button onclick="RC.nav(1)">▶</button><button onclick="RC.hoy()">Hoy</button><select onchange="RC.sede(this.value)">'+sedeOpts+'</select><button onclick="RC.recargar()" style="margin-left:auto">↻ Actualizar</button></div>'+
      (sync?sync:"")+
      '<div class="rc-chips"><div class="rc-chip"><b>'+cR+'</b>Reservas</div><div class="rc-chip"><b>'+cO+'</b>Ofertas</div><div class="rc-chip"><b>'+cS+'</b>Servicios (móvil bloqueado)</div></div>'+
      (all.length?'<div class="rc-wrap"><div class="rc-t"><div class="rc-h"><div></div><div class="rc-d">'+dias+'</div></div>'+filas+'</div></div>':'<div class="rc-vacio">Cargando el calendario real…</div>')+
      '<div class="rc-leg">'+leg+'<span><i style="border:1px dashed #aaa"></i>Oferta (tentativa)</span><span><i style="background:repeating-linear-gradient(45deg,#4b5563,#4b5563 4px,#374151 4px,#374151 8px)"></i>Servicio</span></div>'+
      '<div id="'+id+'_det"></div></div>';
    if(ST.sel) mostrarDet(id);
  }
  function mostrarDet(id){
    var s=ST.sel, box=document.getElementById(id+"_det"); if(!s||!box)return;
    var e=datos().filter(function(x){return x.num===s.num&&x.tipo===s.tipo&&x.mov===s.mov;})[0]; if(!e){box.innerHTML="";return;}
    var noches=Math.round((e.ff-e.fi)/86400000);
    box.innerHTML='<div class="rc-det"><b>'+esc(e.tipo)+' N° '+esc(e.num)+'</b> · Móvil '+e.mov+(patente(e.mov)?" ("+esc(patente(e.mov))+")":"")+(e.edit?" · corregido a mano":"")+'<br>Del '+ddmm(e.fi)+'/'+e.fi.getFullYear()+' al '+ddmm(e.ff)+'/'+e.ff.getFullYear()+' · '+noches+' noche'+(noches!==1?"s":"")+' · Sede: '+esc(SEDN[e.sede]||e.sede||"—")+(e.cli?'<br>Cliente: '+esc(e.cli):'')+'</div>';
  }
  function todos(){pintar("resCalA");pintar("resCalB");}
  window.RC={
    nav:function(d){ST.m+=d;if(ST.m<0){ST.m=11;ST.y--;}if(ST.m>11){ST.m=0;ST.y++;}ST.sel=null;todos();},
    hoy:function(){var n=new Date();ST.y=n.getFullYear();ST.m=n.getMonth();ST.sel=null;todos();},
    sede:function(v){ST.sede=v;ST.sel=null;todos();},
    det:function(id,mv,num,tipo){ST.sel={mov:mv,num:num,tipo:tipo};todos();},
    recargar:function(){try{loadAndRender().then(todos);}catch(e){todos();}},
    pintar:todos
  };

  /* reemplazar los iframes de Google Calendar por el calendario real */
  function reemplazar(idIframe,idNuevo){
    var f=document.getElementById(idIframe); if(!f||document.getElementById(idNuevo))return;
    var d=document.createElement("div"); d.id=idNuevo; d.style.cssText="flex:1;overflow:auto;min-height:0;width:100%;";
    f.parentNode.style.overflow="auto"; f.parentNode.replaceChild(d,f);
  }
  reemplazar("reservasIframe","resCalA"); reemplazar("opResIframe","resCalB");
  document.querySelectorAll("#reservasContent a[href*='calendar.google'],#opResContent a[href*='calendar.google']").forEach(function(a){a.style.display="none";});
  var selVista=document.querySelector("#opResContent select"); if(selVista)selVista.style.display="none";

  /* pestaña Reservas dentro del dashboard de supervisores */
  window.abrirPestañaReservas=function(){
    if(OK.a){document.getElementById("reservasLock").style.display="none";document.getElementById("reservasContent").style.display="flex";todos();}
    else{document.getElementById("reservasLock").style.display="flex";document.getElementById("reservasContent").style.display="none";document.getElementById("reservasPassInput").value="";document.getElementById("reservasPassError").style.display="none";}
  };
  window.verificarPassReservas=function(){
    var inp=document.getElementById("reservasPassInput"),err=document.getElementById("reservasPassError");
    if(inp.value===RESERVAS_PASS){OK.a=true;err.style.display="none";document.getElementById("reservasLock").style.display="none";document.getElementById("reservasContent").style.display="flex";todos();}
    else{err.style.display="block";inp.value="";inp.focus();setTimeout(function(){err.style.display="none";},3000);}
  };
  window.cerrarReservas=function(){OK.a=false;document.getElementById("reservasLock").style.display="flex";document.getElementById("reservasContent").style.display="none";};

  /* frame Reservas de Gestión operativa */
  window.opAbrirReservasFrame=function(){
    ["opInicio","opCel","opPC"].forEach(function(i){var e=document.getElementById(i);if(e)e.style.display="none";});
    var fr=document.getElementById("opReservas"); if(fr){fr.style.display="flex";fr.style.flexDirection="column";}
    if(OK.b)window.opMostrarCalRes();
    else{document.getElementById("opResLock").style.display="flex";document.getElementById("opResContent").style.display="none";document.getElementById("opResPass").value="";}
  };
  window.opVerificarPassRes=function(){
    var v=document.getElementById("opResPass").value,err=document.getElementById("opResPassError");
    if(v===OP_RES_PASS){OK.b=true;err.style.display="none";window.opMostrarCalRes();}
    else{document.getElementById("opResPass").value="";err.style.display="block";setTimeout(function(){err.style.display="none";},2500);}
  };
  window.opMostrarCalRes=function(){
    document.getElementById("opResLock").style.display="none";
    document.getElementById("opResContent").style.display="flex";
    todos();
    try{iniciarDashboard().then(todos);}catch(e){}
  };
  window.opCambiarVistaRes=function(){};
  window.opCerrarSesionRes=function(){OK.b=false;document.getElementById("opResLock").style.display="flex";document.getElementById("opResContent").style.display="none";document.getElementById("opResPass").value="";};
  setInterval(function(){if(OK.a||OK.b)todos();},60000);

  /* móvil nuevo: si no tiene ningún ítem de mantenimiento, se le cargan los del catálogo (sin activar) */
  if(typeof buildVehicles==="function"){
    var _bv=buildVehicles;
    window.buildVehicles=buildVehicles=function(data){
      try{
        var mapa=getMovilAPatenteActivo(), elim=new Set(STATE.catalogoEliminados||[]);
        var cat=(STATE.catalogo&&STATE.catalogo.length)?STATE.catalogo:CATALOGO_DEFAULT;
        Object.keys(mapa).forEach(function(mv){
          var pat=mapa[mv]; if(!pat)return;
          var tiene=(data.mantenimiento||[]).some(function(r){return r.patente===pat;})||MANT_EMBED.some(function(r){return r.patente===pat;});
          if(!tiene){
            if(!data.mantenimiento)data.mantenimiento=[];
            cat.forEach(function(c){if(!elim.has(c.item))data.mantenimiento.push({patente:pat,item:c.item,proximoKm:null,vtoItv:""});});
          }
        });
      }catch(e){console.warn("Parche móvil nuevo:",e);}
      return _bv(data);
    };
  }
})();
</script>
